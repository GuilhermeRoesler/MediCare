# Deploy rápido em hospedagens com Docker (Railway / Render / Fly.io)
#
# 1. Conecte este repositório ao provedor
# 2. Defina as variáveis: DB_HOST, DB_NAME, DB_USER, DB_PASS
# 3. Provisionamento MySQL (serviço gerenciado) + app a partir do Dockerfile
# 4. Document Root efetivo: /public (já configurado no Dockerfile)
#
# Após o deploy, atualize a seção "Demonstração" do README.md com a URL pública.

services:
  - type: web
    name: medicare
    runtime: docker
    plan: free
    healthCheckPath: /autenticacao.php
    envVars:
      - key: DB_HOST
        fromDatabase:
          name: medicare-db
          property: host
      - key: DB_NAME
        fromDatabase:
          name: medicare-db
          property: database
      - key: DB_USER
        fromDatabase:
          name: medicare-db
          property: user
      - key: DB_PASS
        fromDatabase:
          name: medicare-db
          property: password

databases:
  - name: medicare-db
    plan: free
